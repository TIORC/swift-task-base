<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORCOMA Suporte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="screen">
    <div class="header">
      <h1>🔧 ORCOMA Suporte</h1>
      <p class="subtitle">Faça login para abrir chamados</p>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="seu@email.com" />
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-password" placeholder="••••••••" />
    </div>
    <button id="login-btn" class="btn-primary" onclick="doLogin()">Entrar</button>
    <p id="login-error" class="error"></p>
  </div>

  <!-- MAIN SCREEN -->
  <div id="main-screen" class="screen" style="display:none;">
    <div class="header">
      <h1>🔧 Abrir Chamado</h1>
      <p class="subtitle">Siga as etapas abaixo</p>
      <p id="user-info" class="user-info"></p>
    </div>

    <!-- STEP 1: CATEGORIA -->
    <div class="step-block">
      <div class="step-label"><span class="step-num">1</span> Categoria</div>
      <div class="buttons-grid">
        <button type="button" class="ticket-btn" data-category="computador" onclick="selectCategory('computador')">
          <span class="icon">💻</span>
          <span class="label">Computador</span>
          <span class="check">✓</span>
        </button>
        <button type="button" class="ticket-btn" data-category="sistema" onclick="selectCategory('sistema')">
          <span class="icon">🧾</span>
          <span class="label">Sistema</span>
          <span class="check">✓</span>
        </button>
        <button type="button" class="ticket-btn" data-category="impressora" onclick="selectCategory('impressora')">
          <span class="icon">🖨️</span>
          <span class="label">Impressora</span>
          <span class="check">✓</span>
        </button>
        <button type="button" class="ticket-btn" data-category="ramal" onclick="selectCategory('ramal')">
          <span class="icon">☎️</span>
          <span class="label">Ramal</span>
          <span class="check">✓</span>
        </button>
      </div>
    </div>

    <!-- STEP 2: DESCRIÇÃO -->
    <div class="step-block">
      <div class="step-label"><span class="step-num">2</span> Descrição <span class="optional">(opcional)</span></div>
      <div class="form-group">
        <textarea id="description" placeholder="Descreva o problema brevemente..." rows="3"></textarea>
      </div>
    </div>


    <div id="status-msg" class="status-msg"></div>

    <!-- ACTION -->
    <button id="submit-btn" class="btn-primary" onclick="submitTicket()" disabled>
      Enviar chamado
    </button>

    <!-- SUCCESS PANEL -->
    <div id="success-panel" class="success-panel" style="display:none;">
      <div class="success-icon">✅</div>
      <div class="success-title">Chamado enviado com sucesso</div>
      <div class="success-details" id="success-details"></div>
      <button class="btn-secondary" onclick="resetForm()">Abrir novo chamado</button>
    </div>

    <div class="footer">
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
